<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bisnis Emas">
<meta name="theme-color" content="#14120d">
<link rel="apple-touch-icon" href="logo-icon.png">
<link rel="icon" type="image/png" href="logo-icon.png">
<title>Bisnis Emas</title>
<style>
:root{--bg:#14120d;--card:#1f1c15;--line:#3a3428;--gold:#d8b04c;--gold2:#f3d98b;--tx:#f2ede2;--mut:#a39a86;--ok:#5fbf7a;--bad:#e46b5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:19px;color:var(--gold2)}
header small{color:var(--mut);display:block;font-size:12px}
main{padding:14px 14px 20px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--gold2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:17px;margin-top:2px}
.kpi span{color:var(--mut);font-size:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;background:#0f0d09;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:16px}
button{background:var(--gold);color:#1a1508;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
button.sec{background:transparent;color:var(--gold2);border:1px solid var(--gold)}
button.sm{padding:6px 10px;font-size:13px}
button.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.tag.g{border-color:var(--gold);color:var(--gold2)}
nav{position:fixed;bottom:0;left:0;right:0;background:#0f0d09;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;min-width:0;background:none;color:var(--mut);border-radius:0;padding:9px 2px 8px;font-size:11px;font-weight:500}
nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:1px}
nav button.on{color:var(--gold2)}
.alert{background:#3a2a10;border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:10px 12px;margin-bottom:12px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#lock input{max-width:220px;text-align:center;font-size:28px;letter-spacing:10px;margin:14px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal .box{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 6px;color:var(--gold2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:13px;padding:8px}
.seg button.on{background:var(--gold);color:#1a1508}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#1a1508;padding:8px 14px;border-radius:20px;font-weight:600;z-index:30}
canvas{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>

<script>
/* ================= DATA ================= */
const KEY='bisnisEmas.v1';
const GRAMS=[0.5,1,2,3,5,10,25,50,100];
const DEF={
  settings:{nama:'@safehaven.assets',wa:'',marginJual:15000,spreadBuyback:60000,pajakJual:0,pajakBeli:0,merek:['Antam','UBS','Galeri24','Lainnya'],tampilToko:true,potBbAntam:0,linkWA:'https://whatsapp.com/channel/0029VbE1VFn4IBhGYlutXx2m',linkTG:'@safehavenassets1',linkWeb:'',tdKey:'',
    offset:{'0.5':50000,'1':0,'2':-60000,'3':-115000,'5':-225000,'10':-505000,'25':-1388000,'50':-2855000,'100':-5788000,'250':-14735000,'500':-29680000,'1000':-59400000}},
  harga:{tgl:'',base:{},xau:0,kurs:0},
  stok:[],trx:[],pelanggan:[],pesanan:[],alerts:[],riwayat:[],biaya:[],
  global:{xau:0,kurs:0,t:0,tk:0,hist:[]},
  antam:{tgl:'',jam:'',beli:0,bb:0,prevBeli:0,prevBb:0,spotRef:0,xauRef:0,riwayat:[]}
};
let S=load();
if(!S.settings.linkWA)S.settings.linkWA=DEF.settings.linkWA;if(!S.settings.linkTG||/^@?safehavenasset$|t\.me\/safehavenasset$/.test(S.settings.linkTG.trim()))S.settings.linkTG=DEF.settings.linkTG;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return Object.assign(structuredClone(DEF),d,{settings:Object.assign({},DEF.settings,d.settings||{})})}catch(e){}return structuredClone(DEF)}
function save(quiet){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Gagal menyimpan')}if(!quiet&&typeof jadwalBackup==='function')jadwalBackup()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTgl=t=>t?new Date(t+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const ym=t=>(t||'').slice(0,7);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ================= HARGA ================= */
const base=m=>num(S.harga.base[m]);
const hJual=(m,g)=>(base(m)+S.settings.marginJual)*g;
const hBuyback=(m,g)=>m==='Antam'&&S.antam?.bb&&S.antam.tgl===S.harga.tgl?Math.max(0,(S.antam.bb-num(S.settings.potBbAntam))*g):Math.max(0,(base(m)-S.settings.spreadBuyback)*g);
const spotGram=()=>S.harga.xau&&S.harga.kurs?S.harga.xau*S.harga.kurs/31.1035:0;
function cekAlert(){
  const hit=[];
  S.alerts.filter(a=>a.aktif).forEach(a=>{const h=base(a.merek);if(!h)return;
    if((a.arah==='atas'&&h>=a.level)||(a.arah==='bawah'&&h<=a.level))hit.push(a)});
  return hit;
}

/* ================= NAV ================= */
const TABS=[['harga','💰','Harga'],['ch','📣','Channel'],['stok','📦','Stok'],['trx','🔁','Jual-Beli'],['plg','👥','Pelanggan'],['lap','📊','Laporan']];
let tab='harga';
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  document.getElementById('hNama').textContent=S.settings.nama||'Bisnis Emas';
  document.getElementById('hTgl').textContent='Harga per '+(S.harga.tgl?fmtTgl(S.harga.tgl):'— belum diisi');
  document.getElementById('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
  document.getElementById('app').innerHTML=({harga:vHarga,ch:vCh,stok:vStok,trx:vTrx,plg:vPlg,lap:vLap,set:vSet}[tab])();
  if(tab==='harga')drawWA();
  if(tab==='ch'){drawPost();const pc=document.getElementById('poster');if(pc)drawPoster(pc)}
}

/* ---------- Tab Harga ---------- */
let waMerek=null;
function vHarga(){
  const M=S.settings.merek; if(!waMerek||!M.includes(waMerek))waMerek=M[0];
  const hit=cekAlert();
  const sp=spotGram();
  return `${bannerAntam()}
  ${hit.map(a=>`<div class="alert">🔔 Harga ${esc(a.merek)} ${a.arah==='atas'?'naik ke/di atas':'turun ke/di bawah'} ${rp(a.level)}/gr — sekarang ${rp(base(a.merek))}/gr</div>`).join('')}
  <div class="card"><h3>Harga dasar hari ini (per gram)</h3>
    <p class="mut" style="margin:0 0 6px">Isi harga resmi per gram (kepingan 1 gr) dari Logam Mulia, UBS, Galeri24, dll.</p>
    ${M.map(m=>`<label>${esc(m)}</label><input inputmode="numeric" id="b_${esc(m)}" value="${S.harga.base[m]?Math.round(base(m)).toLocaleString('id-ID'):''}" placeholder="contoh 2.250.000">`).join('')}
    <div class="row" style="margin-top:12px"><button class="grow" onclick="simpanHarga()">Simpan harga</button></div>
  </div>
  <div class="card"><h3>Kalkulator harga spot</h3>
    <div class="row"><div class="grow"><label>XAUUSD ($/oz)</label><input inputmode="decimal" id="xau" value="${S.harga.xau||''}"></div>
    <div class="grow"><label>Kurs USD/IDR</label><input inputmode="numeric" id="kurs" value="${S.harga.kurs||''}"></div></div>
    <p>Spot: <b>${sp?rp(sp):'-'}</b> / gram</p>
    <div class="row"><button class="sec sm" onclick="hitungSpot()">Hitung</button>
    <select id="spotKe" style="width:auto;flex:1">${M.map(m=>`<option>${esc(m)}</option>`)}</select>
    <button class="sm" onclick="pakaiSpot()">Pakai sbg dasar</button></div>
  </div>
  <div class="card"><h3>Daftar harga jual & buyback</h3>
    <div class="seg">${M.map(m=>`<button class="${m===waMerek?'on':''}" onclick="waMerek='${esc(m)}';render()">${esc(m)}</button>`).join('')}</div>
    ${base(waMerek)?`<table><tr><th>Gram</th><th>Jual</th><th>Buyback</th></tr>
    ${GRAMS.map(g=>`<tr><td>${g} gr</td><td>${rp(hJual(waMerek,g))}</td><td>${rp(hBuyback(waMerek,g))}</td></tr>`).join('')}</table>
    <p class="mut">Margin jual ${rp(S.settings.marginJual)}/gr · potongan buyback ${rp(S.settings.spreadBuyback)}/gr (ubah di Pengaturan)</p>`:'<p class="mut">Isi harga dasar dulu.</p>'}
  </div>
  <div class="card"><h3>Daftar harga untuk WhatsApp</h3>
    ${base(waMerek)?`<canvas id="wa" width="1080" height="1350"></canvas>
    <div class="row" style="margin-top:10px"><button class="grow" onclick="shareImg()">Bagikan gambar</button><button class="sec grow" onclick="copyTeks()">Salin teks</button></div>`:'<p class="mut">Isi harga dasar dulu.</p>'}
  </div>
  <div class="card"><h3>Alert harga</h3>
    <p class="mut" style="margin:0 0 6px">Peringatan muncul di atas saat harga dasar yang Anda simpan melewati level.</p>
    ${S.alerts.map(a=>`<div class="item row"><div class="grow">${esc(a.merek)} ${a.arah==='atas'?'≥':'≤'} ${rp(a.level)}/gr ${a.aktif?'<span class="tag g">aktif</span>':'<span class="tag">mati</span>'}</div>
      <button class="sec sm" onclick="togAlert('${a.id}')">${a.aktif?'Matikan':'Aktifkan'}</button><button class="del sm" onclick="hapus('alerts','${a.id}')">✕</button></div>`).join('')||'<p class="mut">Belum ada alert.</p>'}
    <button class="sec sm" style="margin-top:8px" onclick="formAlert()">+ Tambah alert</button>
  </div>
  ${vGrafik()}`;
}
function simpanHarga(){
  S.settings.merek.forEach(m=>{const v=num(document.getElementById('b_'+m).value);if(v){S.harga.base[m]=v;S.riwayat=S.riwayat.filter(r=>!(r.tgl===today()&&r.merek===m));S.riwayat.push({tgl:today(),merek:m,harga:v})}});
  S.harga.tgl=today();save();render();
  const h=cekAlert();toast(h.length?'🔔 '+h.length+' alert tercapai':'Harga tersimpan');
}
function hitungSpot(){S.harga.xau=num(document.getElementById('xau').value.replace('.',','));S.harga.kurs=num(document.getElementById('kurs').value);save();render()}
function pakaiSpot(){hitungSpot();const sp=spotGram();if(!sp)return toast('Isi XAUUSD dan kurs');const m=document.getElementById('spotKe').value;S.harga.base[m]=Math.round(sp);S.harga.tgl=today();save();render();toast('Dasar '+m+' = '+rp(sp))}
function formAlert(){form('Tambah alert',[
  {k:'merek',l:'Merek',t:'sel',o:S.settings.merek},
  {k:'arah',l:'Kondisi',t:'sel',o:[['atas','Naik ke / di atas'],['bawah','Turun ke / di bawah']]},
  {k:'level',l:'Level harga per gram',t:'rp'}],d=>{if(!d.level)return false;S.alerts.push({id:uid(),...d,aktif:true})})}
function togAlert(id){const a=S.alerts.find(x=>x.id===id);a.aktif=!a.aktif;save();render()}
function vGrafik(){
  const r=S.riwayat.filter(x=>x.merek===waMerek).sort((a,b)=>a.tgl<b.tgl?-1:1).slice(-30);
  if(r.length<2)return '';
  const W=320,H=110,mn=Math.min(...r.map(x=>x.harga)),mx=Math.max(...r.map(x=>x.harga)),rg=mx-mn||1;
  const pts=r.map((x,i)=>`${(i/(r.length-1)*W).toFixed(1)},${(H-8-(x.harga-mn)/rg*(H-16)).toFixed(1)}`).join(' ');
  return `<div class="card"><h3>Riwayat harga ${esc(waMerek)}</h3>
  <svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${pts}" fill="none" stroke="#d8b04c" stroke-width="2"/></svg>

function formStok(id){const s=id?S.stok.find(x=>x.id===id):null;
  form(s?'Edit stok':'Tambah stok',[
  {k:'merek',l:'Merek',t:'sel',o:S.settings.merek,v:s?.merek},
  {k:'gram',l:'Berat (gram)',t:'sel',o:GRAMS.map(String),v:s?String(s.gram):'1'},
  {k:'qty',l:'Jumlah keping',t:'num',v:1,hide:!!s},
  {k:'seri',l:'No. seri sertifikat (pisahkan koma jika >1 keping)',v:s?.seri},
  {k:'modal',l:'Harga beli per keping',t:'rp',v:s?.modal},
  {k:'sumber',l:'Dibeli dari (supplier / pelanggan)',v:s?.sumber},
  {k:'tgl',l:'Tanggal',t:'date',v:s?.tgl||today()}],d=>{
    if(!d.modal)return false;d.gram=num(d.gram.replace('.',','));

      S.trx.push({id:uid()+i,tgl:d.tgl,jenis:'beli',stokId:sid,merek:d.merek,gram:d.gram,harga:d.modal,pihak:d.sumber})}
  })}
function hapusStok(id){if(!confirmDel())return;S.stok=S.stok.filter(s=>s.id!==id);S.trx=S.trx.filter(t=>t.stokId!==id);save();render()}

/* ---------- Jual ---------- */
function formJual(stokId,pesananId){
  const s=S.stok.find(x=>x.id===stokId);const ps=pesananId?S.pesanan.find(p=>p.id===pesananId):null;
  form('Jual '+s.merek+' '+s.gram+' gr',[
    {k:'harga',l:'Harga jual (saran: '+(base(s.merek)?rp(hJual(s.merek,s.gram)):'isi harga dasar')+')',t:'rp',v:ps?.harga||(base(s.merek)?Math.round(hJual(s.merek,s.gram)):'')},
    {k:'plg',l:'Pelanggan',t:'sel',o:[['','— umum —'],...S.pelanggan.map(p=>[p.id,p.nama])],v:ps?.plg},
    {k:'tgl',l:'Tanggal',t:'date',v:today()},
    {k:'cat',l:'Catatan',v:''}],d=>{

function waNum(h){h=String(h).replace(/\D/g,'');return h.startsWith('0')?'62'+h.slice(1):h}

function vReminder(){
  const now=new Date(today());const L=S.pelanggan.filter(p=>p.rutin>0).map(p=>{const last=S.trx.filter(t=>t.plg===p.id&&t.jenis==='jual').map(t=>t.tgl).sort().at(-1);
    const hari=last?Math.floor((now-new Date(last))/864e5):null;return {p,hari}}).filter(x=>x.hari===null||x.hari>=x.p.rutin);
  if(!L.length)return '';
  return `<div class="card"><h3>🔔 Saatnya hubungi pelanggan</h3>${L.map(({p,hari})=>`<div class="item row"><div class="grow">${esc(p.nama)}<div class="mut">${hari===null?'belum pernah beli':hari+' hari sejak pembelian terakhir'}</div></div>

}

/* ---------- Tab Laporan ---------- */
let bln=ym(today());
function vLap(){
  const J=S.trx.filter(t=>t.jenis==='jual'&&ym(t.tgl)===bln),B=S.trx.filter(t=>t.jenis==='beli'&&ym(t.tgl)===bln);
  const omzet=J.reduce((a,t)=>a+t.harga,0),laba=J.reduce((a,t)=>a+t.harga-t.modal,0),beli=B.reduce((a,t)=>a+t.harga,0);
  const pj=omzet*S.settings.pajakJual/100,pb=beli*S.settings.pajakBeli/100;
  const laris={};J.forEach(t=>{const k=t.merek+' '+t.gram+' gr';laris[k]=(laris[k]||0)+1});
  const bulan=[...new Set(S.trx.map(t=>ym(t.tgl)).concat(S.biaya.map(b=>ym(b.tgl)),ym(today())))].sort().reverse();
  const trend=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=ymL(d);
    trend.push([k,S.trx.filter(t=>t.jenis==='jual'&&ym(t.tgl)===k).reduce((a,t)=>a+t.harga-t.modal,0)-biayaBulan(k)])}
  const by=biayaBulan(bln),bersih=laba-by,BL=S.biaya.filter(b=>ym(b.tgl)===bln).sort((a,b)=>a.tgl<b.tgl?1:-1);
  const mx=Math.max(1,...trend.map(t=>Math.abs(t[1])));
  return `<select onchange="bln=this.value;render()" style="margin-bottom:12px">${bulan.map(b=>`<option ${b===bln?'selected':''} value="${b}">${new Date(b+'-01T00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`).join('')}</select>
  <div class="kpi"><div><span>Omzet penjualan</span><b>${rp(omzet)}</b></div><div><span>Laba kotor</span><b class="${laba>=0?'ok':'bad'}">${rp(laba)}</b></div>
  <div><span>Biaya operasional</span><b>${rp(by)}</b></div><div><span>Laba bersih</span><b class="${bersih>=0?'ok':'bad'}">${rp(bersih)}</b></div>
  <div><span>Keping terjual</span><b>${J.length}</b></div><div><span>Belanja stok</span><b>${rp(beli)}</b></div></div>
  <div class="card"><h3>Biaya operasional</h3>${BL.map(b=>`<div class="item row"><div class="grow">${esc(b.kat)}<div class="mut">${fmtTgl(b.tgl)}${b.cat?' · '+esc(b.cat):''}</div></div><b>${rp(b.jumlah)}</b><button class="del sm" onclick="hapus('biaya','${b.id}')">✕</button></div>`).join('')||'<p class="mut">Belum ada biaya bulan ini.</p>'}
   <button class="sec sm" style="margin-top:8px" onclick="formBiaya()">+ Biaya (ongkir, packing, dll.)</button></div>
  <div class="card"><h3>Laba bersih 6 bulan terakhir</h3>${trend.map(([k,v])=>`<div class="row" style="margin:5px 0"><span style="width:60px" class="mut">${new Date(k+'-01T00:00').toLocaleDateString('id-ID',{month:'short'})}</span>
   <div class="grow" style="background:#0f0d09;border-radius:6px;height:16px"><div style="width:${Math.abs(v)/mx*100}%;height:100%;border-radius:6px;background:${v>=0?'var(--gold)':'var(--bad)'}"></div></div><span style="width:110px;text-align:right">${rp(v)}</span></div>`).join('')}</div>
  <div class="card"><h3>Paling laku bulan ini</h3>${Object.entries(laris).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="row item"><span class="grow">${esc(k)}</span><b>${n} keping</b></div>`).join('')||'<p class="mut">Belum ada penjualan.</p>'}</div>
  <div class="card"><h3>Rekap pajak</h3>
   <table><tr><th></th><th>Nilai</th><th>Tarif</th><th>Estimasi</th></tr>
   <tr><td>Penjualan</td><td>${rp(omzet)}</td><td>${S.settings.pajakJual}%</td><td>${rp(pj)}</td></tr>
   <tr><td>Pembelian</td><td>${rp(beli)}</td><td>${S.settings.pajakBeli}%</td><td>${rp(pb)}</td></tr></table>
   <p class="mut">Tarif diisi sendiri di Pengaturan. Aturan pajak emas sering berubah, jadi pastikan tarif & kewajibannya ke DJP/konsultan pajak.</p></div>
  <button class="sec" style="width:100%" onclick="exportCSV()">Unduh transaksi bulan ini (CSV)</button>`;
}
function exportCSV(){const R=[['Tanggal','Jenis','Merek','Gram','Harga','Modal','Laba','Pihak','Catatan']].concat(
  S.trx.filter(t=>ym(t.tgl)===bln).sort((a,b)=>a.tgl<b.tgl?-1:1).map(t=>[t.tgl,t.jenis,t.merek,t.gram,t.harga,t.modal||'',t.jenis==='jual'?t.harga-t.modal:'',t.pihak||'',t.cat||''])
  .concat(S.biaya.filter(b=>ym(b.tgl)===bln).map(b=>[b.tgl,'biaya',b.kat,'',b.jumlah,'',-b.jumlah,'',b.cat||''])));
  dl(R.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'transaksi-emas-'+bln+'.csv','text/csv')}
function dl(txt,nama,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=nama;a.click()}

function simpanSet(){const v=i=>document.getElementById(i).value,s=S.settings;
  s.nama=v('s_nama');s.wa=v('s_wa');s.linkWA=v('s_lwa').trim();s.linkTG=v('s_ltg').trim();s.linkWeb=v('s_lweb').trim();s.tdKey=v('s_td').trim();s.merek=v('s_merek').split(',').map(x=>x.trim()).filter(Boolean);if(!s.merek.length)s.merek=['Lainnya'];
  s.marginJual=num(v('s_mj'));s.potBbAntam=num(v('s_pba'));s.spreadBuyback=num(v('s_sb'));s.pajakJual=parseFloat(v('s_pj').replace(',','.'))||0;s.pajakBeli=parseFloat(v('s_pb').replace(',','.'))||0;

function restore(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.stok||!d.settings)throw 0;if(!confirm('Timpa semua data dengan backup ini?'))return;
  localStorage.setItem(KEY,t);S=load();toast('Data dipulihkan');render()}catch(e){toast('File backup tidak valid')}})}

const OZ=31.1034768;
const G_=()=>S.global, A_=()=>S.antam;
const gLabel=g=>g>=1000?(g/1000)+' kg':String(g).replace('.',',')+' gr';
const spotG=()=>G_().xau&&G_().kurs?G_().xau*G_().kurs/OZ:0;
const estAdj=()=>A_().spotRef&&spotG()?spotG()-A_().spotRef:0;
const rnd=n=>Math.round(n/1000)*1000;
const fUsd=n=>Number(n||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=x=>(x*100).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const sRp=n=>(n<0?'-':'+')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID');
const kF=n=>{const a=Math.abs(n),s=n<0?'-':n>0?'+':'';return a>=1e6?s+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:2})+'jt':a>=1e3?s+(a/1e3).toLocaleString('id-ID',{maximumFractionDigits:1})+'rb':s+a};
const offs=g=>Number(S.settings.offset?.[String(g)])||0;
const antamG=(g,b)=>(b??A_().beli)*g+offs(g);
const jamNow=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace(':','.');
const hariPanjang=t=>new Date(t+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function chgH(now,prev){if(!prev)return '<span class="mut">-</span>';const d=now-prev;
  return `<span class="${d>0?'ok':d<0?'bad':'mut'}">${d>0?'▲':d<0?'▼':'='} ${rp(Math.abs(d))} · ${pct(Math.abs(d)/prev)}</span>`}

/* ---- ambil harga global ---- */
let fetching=false;
async function fetchGlobal(force){
  const G=G_();if(fetching)return;if(!force&&Date.now()-G.t<55000)return;fetching=true;
  try{
    const [x]=await Promise.allSettled([fetch('https://api.gold-api.com/price/XAU',{cache:'no-store'}).then(r=>r.json()),fetchKurs(force)]);
    let ok=false;
    if(x.status==='fulfilled'&&x.value?.price){G.xau=+x.value.price;G.t=Date.now();G.xauAt=x.value.updatedAt||'';ok=true}
    if(ok&&G.kurs){G.hist.push({t:G.t,x:G.xau,k:G.kurs});const lim=Date.now()-3*864e5;G.hist=G.hist.filter(h=>h.t>lim).slice(-1500);
      S.harga.xau=G.xau;S.harga.kurs=G.kurs;save(true);
      const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if((tab==='ch'||tab==='harga')&&!busy&&document.getElementById('modal').style.display!=='flex')render();
    }else if(force)toast('Gagal ambil harga global, coba lagi / isi manual');
  }finally{fetching=false}
}
setInterval(()=>{if(!document.hidden&&(tab==='ch'||tab==='harga'))fetchGlobal()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchGlobal()});
setTimeout(()=>fetchGlobal(),300);
function formManualGlobal(){const G=G_();form('Isi harga global manual',[{k:'xau',l:'XAUUSD ($/oz), mis. 3526,12',v:G.xau?String(G.xau).replace('.',','):''},{k:'kurs',l:'Kurs USD/IDR',t:'rp',v:Math.round(G.kurs)}],
  d=>{const x=num(d.xau);if(!x||!d.kurs)return false;Object.assign(G,{xau:x,kurs:d.kurs,t:Date.now(),tk:Date.now(),kursAt:Date.now(),kursSrc:'input manual'});G.hist.push({t:G.t,x,k:d.kurs});S.harga.xau=x;S.harga.kurs=d.kurs})}

function formAntam(){const A=A_();
  form('Update harga Antam resmi',[
    {k:'beli',l:'Harga beli emas 1 gr (Logam Mulia)',t:'rp',v:A.tgl===today()?A.beli:''},
    {k:'bb',l:'Harga buyback per gram',t:'rp',v:A.tgl===today()?A.bb:''},
    {k:'jam',l:'Jam update (WIB)',v:A.tgl===today()?A.jam:jamNow()}],d=>{
    if(!d.beli||!d.bb)return false;
    if(A.tgl!==today()){if(A.beli&&A.spotRef&&spotG())A.lastProj={tgl:today(),proj:projB(),actual:d.beli};A.prevBeli=A.beli;A.prevBb=A.bb}
    Object.assign(A,{tgl:today(),jam:d.jam||jamNow(),beli:d.beli,bb:d.bb,spotRef:spotG(),xauRef:G_().xau,updAt:Date.now()});
    A.riwayat=A.riwayat.filter(r=>r.tgl!==today());A.riwayat.push({tgl:today(),beli:d.beli,bb:d.bb,spot:Math.round(spotG())});A.riwayat=A.riwayat.slice(-120);
    S.harga.base.Antam=d.beli;S.harga.tgl=today();
    S.riwayat=S.riwayat.filter(r=>!(r.tgl===today()&&r.merek==='Antam'));S.riwayat.push({tgl:today(),merek:'Antam',harga:d.beli});
    postJenis='antam';
    if(ghCfg().auto&&ghCfg().token)setTimeout(publish,400);
  },'Isi sesuai harga resmi di logammulia.com. Perubahan dihitung dari harga hari sebelumnya.')}

    AG.filter(g=>g!==1).forEach(g=>{const v=d[String(g).replace('.','_')];if(v)S.settings.offset[String(g)]=v-A.beli*g})
  },'Cocokkan dengan daftar harga di logammulia.com. Cukup sesekali, karena selisih per gramasi jarang berubah.')}

function logoAt(x,X,Y,sz){const L=document.getElementById('hLogo');if(L&&L.complete&&L.naturalWidth){x.save();x.beginPath();x.arc(X+sz/2,Y+sz/2,sz/2+4,0,7);x.fillStyle='#d8b04c';x.fill();x.drawImage(L,X,Y,sz,sz);x.restore()}}
/* ---- Teks posting ---- */
function postText(){const A=A_(),G=G_(),s=S.settings,adj=estAdj();
  const toko=s.tampilToko&&A.beli?`\n🏪 *Harga ${s.nama}*\n• Jual: ${rp(hJual('Antam',1))}/gr\n• Buyback: ${rp(hBuyback('Antam',1))}/gr\n`:'';
  const kaki=`${toko}${s.wa?`\n📲 Pesan/tanya: wa.me/${waNum(s.wa)}`:''}${s.linkWA?`\n🔔 Channel WA: ${s.linkWA}`:''}${tgLink()?`\n📢 Telegram: ${tgLink()}`:''}${pageUrl()?`\n🌐 Harga live: ${pageUrl()}`:''}\n\n_Harga referensi, dapat berubah sewaktu-waktu. Proyeksi hanya perkiraan, bukan saran investasi._`;
  if(postJenis==='antam'){
    const d=A.beli-A.prevBeli,db=A.bb-A.prevBb;
    const arah=!A.prevBeli?'':d<0?' · TURUN 🔴🔻':d>0?' · NAIK 🟢🔺':' · TETAP ⚪';
    const ch=(x,p)=>p?` (${x<0?'🔻':x>0?'🔺':'='} ${rp(Math.abs(x))} · ${pct(Math.abs(x)/p)})`:'';
    return `📊 *HARGA EMAS ANTAM HARI INI*\n🗓️ ${hariPanjang(A.tgl)} · ⏰ ${A.jam} WIB\n\n🥇 *EMAS per gram*${arah}\n• Harga beli: ${rp(A.beli)}${ch(d,A.prevBeli)}\n• Buyback: ${rp(A.bb)}${ch(db,A.prevBb)}\n• Selisih: ${rp(A.beli-A.bb)} (${pct((A.beli-A.bb)/A.beli)})\n\n📋 *Daftar Harga Emas Batangan*\n`+
      AG.map(g=>`${gLabel(g).padEnd(7)} ${rp(antamG(g))}${A.prevBeli?'  '+kF(d*g):''}`).join('\n')+
      (G.xau?`\n\n🌍 XAUUSD $${fUsd(G.xau)} · Kurs ${rp(G.kurs)}`:'')+`\n`+kaki;
  }
  const head=postJenis==='tutup'?'🔔 *Pasar tutup.*':'🌍 *UPDATE HARGA EMAS GLOBAL*';
  return `${head}\n🗓️ ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})} · ⏰ ${jamNow()} WIB\n\n• XAUUSD: $${fUsd(G.xau)}/oz\n• Kurs: ${rp(G.kurs)}\n• Spot: ${rp(spotG())}/gr`+
    (A.spotRef?`\n\nEmas ${adj<0?'📉 melemah':'📈 menguat'} ${rp(Math.abs(adj))}/gr sejak update Antam ${A.jam} WIB.\n🔮 Proyeksi Antam: beli ${rp(projB())} · buyback ${rp(projBb())}`:'')+`\n`+kaki;
}
function copyPost(){const t=document.getElementById('postTxt')?.value||postText();
  navigator.clipboard?.writeText(t).then(()=>toast('Teks disalin'),()=>prompt('Salin teks:',t))}
function sharePost(){const t=document.getElementById('postTxt')?.value||postText();
  navigator.clipboard?.writeText(t).catch(()=>{});
  document.getElementById('post').toBlob(async b=>{const f=new File([b],`emas-${postJenis}-${today()}.png`,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){toast('Teks tersalin, tempel sebagai keterangan');await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()})}

  x.fillStyle='#d8b04c';x.fillRect(0,1290,1080,60);x.fillStyle='#14120d';x.font=`bold 34px ${FONT}`;x.textAlign='center';
  x.fillText((S.settings.nama||'')+(S.settings.wa?'  ·  WA '+S.settings.wa:''),540,1331);

async function fetchKurs(force){
  const G=G_(),now=Date.now(),td=(S.settings.tdKey||'').trim(),jobs=[];
  if(td&&(force||now-(G.tdT||0)>10*60e3)){G.tdT=now;
    jobs.push(fetch('https://api.twelvedata.com/price?symbol=USD/IDR&apikey='+encodeURIComponent(td),{cache:'no-store'}).then(r=>r.json()).then(j=>j&&j.price?{k:+j.price,at:now,src:'Twelve Data (real-time)'}:null))}
  if(force||!G.kurs||now-(G.tk||0)>15*60e3){
    jobs.push(fetch('https://api.exchangerate.fun/latest?base=USD',{cache:'no-store'}).then(r=>r.json()).then(j=>j&&j.rates&&j.rates.IDR?{k:+j.rates.IDR,at:(j.timestamp||0)*1000,src:'exchangerate.fun (per jam)'}:null));
    jobs.push(fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'}).then(r=>r.json()).then(j=>j&&j.rates&&j.rates.IDR?{k:+j.rates.IDR,at:(j.time_last_update_unix||0)*1000,src:'open.er-api (harian)'}:null))}
  if(!jobs.length)return;
  const res=(await Promise.allSettled(jobs)).map(r=>r.status==='fulfilled'?r.value:null).filter(Boolean).sort((a,b)=>b.at-a.at);
  if(!res.length)return;
  Object.assign(G,{kurs:res[0].k,kursAt:res[0].at,kursSrc:res[0].src,tk:now});
}

/* ---- Proyeksi yang belajar dari riwayat ---- */
function betaCalc(){
  const r=(A_().riwayat||[]).filter(x=>x.spot>0).slice(-41);let sb=0,sbb=0,ss=0,n=0;
  for(let i=1;i<r.length;i++){const a=r[i-1],b=r[i],gap=(new Date(b.tgl)-new Date(a.tgl))/864e5;
    if(gap<1||gap>4)continue;const dS=b.spot-a.spot;if(Math.abs(dS)<3000)continue;
    sb+=(b.beli-a.beli)*dS;sbb+=(b.bb-a.bb)*dS;ss+=dS*dS;n++}
  if(n<5)return {b:1,bb:1,n};const cl=v=>Math.min(1.5,Math.max(0.5,v));return {b:cl(sb/ss),bb:cl(sbb/ss),n};
}
const projB=()=>rnd(A_().beli+betaCalc().b*estAdj()), projBb=()=>rnd(A_().bb+betaCalc().bb*estAdj());
function infoProyeksi(){const A=A_(),be=betaCalc(),lp=A.lastProj;

  if(lp&&lp.proj)s+=` Proyeksi terakhir ${rp(lp.proj)} → resmi ${rp(lp.actual)} (selisih ${rp(Math.abs(lp.actual-lp.proj))}).`;return s+(typeof teksAkurasiApp==='function'?teksAkurasiApp():'')}

async function ghGet(path,raw){const c=ghCfg();

  if(r.status===404)return null;if(!r.ok)throw new Error(r.status===401?'token salah/kedaluwarsa':'HTTP '+r.status);return raw?r.text():r.json()}
async function ghPut(path,text,msg){const c=ghCfg(),m=await ghGet(path);

  if(!p.ok)throw new Error(p.status===401?'token salah/kedaluwarsa':p.status===403||p.status===404?'izin token kurang / repo salah':p.status===409?'bentrok versi, coba lagi':'HTTP '+p.status)}

/* ---- Backup otomatis terenkripsi ---- */
const CLK='bisnisEmas.cloud',BK_PATH='backup/data-emas.enc.json';
const clCfg=()=>{try{return JSON.parse(localStorage.getItem(CLK))||{}}catch(e){return {}}};
const setCl=o=>localStorage.setItem(CLK,JSON.stringify(Object.assign(clCfg(),o)));
const b64e=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enkripsi(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(pass,salt),new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1,app:'safehaven-emas',t:new Date().toISOString(),salt:b64e(salt),iv:b64e(iv),data:b64e(ct)}}
async function dekripsi(pkg,pass){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(pkg.iv)},await kdf(pass,b64d(pkg.salt)),b64d(pkg.data));return JSON.parse(new TextDecoder().decode(pt))}
let bkTimer=null,bkBusy=false;
function jadwalBackup(){const c=clCfg();if(!c.auto||!c.pass||!ghCfg().token)return;clearTimeout(bkTimer);setCl({pending:true});
  bkTimer=setTimeout(()=>backupCloud(false),Math.max(20e3,(c.last||0)+15*60e3-Date.now()))}
async function backupCloud(manual){const c=clCfg();
  if(!ghCfg().token){if(manual)formGh();return}if(!c.pass){if(manual)formPassBackup();return}
  if(bkBusy)return;bkBusy=true;if(manual)toast('Mencadangkan…');
  try{await ghPut(BK_PATH,JSON.stringify(await enkripsi(S,c.pass)),'Backup data '+today()+' '+jamNow());
    setCl({last:Date.now(),pending:false,err:''});if(manual)toast('✓ Backup tersimpan di cloud')}
  catch(e){setCl({err:e.message});if(manual)toast('Backup gagal: '+e.message)}
  finally{bkBusy=false;if(tab==='set'&&document.getElementById('modal').style.display!=='flex')render()}}
document.addEventListener('visibilitychange',()=>{const c=clCfg();if(document.hidden&&c.pending&&c.auto&&Date.now()-(c.last||0)>5*60e3){clearTimeout(bkTimer);backupCloud(false)}});
setTimeout(()=>{if(clCfg().pending)jadwalBackup()},2000);
function formPassBackup(){form('Kata sandi backup',[{k:'p1',l:'Kata sandi (min. 8 karakter)',t:'pass'},{k:'p2',l:'Ulangi kata sandi',t:'pass'}],d=>{
  if((d.p1||'').length<8)return 'Kata sandi minimal 8 karakter';if(d.p1!==d.p2)return 'Kata sandi tidak sama';
  setCl({pass:d.p1,auto:true});setTimeout(()=>backupCloud(true),300)},
  'Data dienkripsi di HP sebelum dikirim, jadi isi backup tidak bisa dibaca tanpa kata sandi ini. CATAT kata sandinya: tanpa itu backup tidak bisa dipulihkan.')}
function formPulihCloud(){if(!ghCfg().token)return formGh();
  form('Pulihkan dari cloud',[{k:'pass',l:'Kata sandi backup',t:'pass'}],d=>{if(!d.pass)return false;(async()=>{
    try{toast('Mengunduh backup…');const t=await ghGet(BK_PATH,true);if(!t)return toast('Belum ada backup di cloud');

  x.fillStyle='#fff';x.fillRect(X,Y,size,size);x.fillStyle='#1a0505';

/* ---- Sinkron dari repo: harga Antam yang diinput lewat Telegram + akurasi prediksi ---- */
async function ambilRepo(path){
  if(ghCfg().token){try{const t=await ghGet(path,true);if(t)return JSON.parse(t)}catch(e){}}
  try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  return null}
let syncAt=0;
async function sinkronRepo(paksa){
  if(!paksa&&Date.now()-syncAt<5*60e3)return;syncAt=Date.now();
  const [D,AK]=await Promise.all([ambilRepo('harga.json'),ambilRepo('akurasi.json')]);let ubah=false;
  if(AK&&AK.ringkasan){S.akurasi={ringkasan:AK.ringkasan,riwayat:(AK.riwayat||[]).slice(-10)};ubah=true}
  const r=D&&D.antam,A=A_();
  if(r&&r.beli&&D.diterbitkan){const t=new Date(D.diterbitkan).getTime(),beda=[r.tgl,r.jam,r.beli,r.bb].join()!==[A.tgl,A.jam,A.beli,A.bb].join();
    if(beda&&t>(A.updAt||0)&&(r.tgl>A.tgl||(r.tgl===A.tgl&&D.sumber==='telegram'))){
      const map={};(A.riwayat||[]).forEach(x=>map[x.tgl]=x);(r.riwayat||[]).forEach(x=>map[x.tgl]=Object.assign({},map[x.tgl]||{},x));
      Object.assign(A,{tgl:r.tgl,jam:r.jam,beli:r.beli,bb:r.bb,prevBeli:r.prevBeli||A.prevBeli,prevBb:r.prevBb||A.prevBb,spotRef:r.spotRef||A.spotRef,xauRef:r.xauRef||A.xauRef,updAt:t,
        riwayat:Object.values(map).sort((a,b)=>a.tgl<b.tgl?-1:1).slice(-120)});
      S.harga.base.Antam=r.beli;if(r.tgl>=(S.harga.tgl||''))S.harga.tgl=r.tgl;
      S.riwayat=S.riwayat.filter(x=>!(x.tgl===r.tgl&&x.merek==='Antam'));S.riwayat.push({tgl:r.tgl,merek:'Antam',harga:r.beli});
      ubah=true;toast('Harga Antam '+r.jam+' diperbarui dari Telegram')}}
  if(ubah){save();const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if((tab==='ch'||tab==='harga')&&!busy&&document.getElementById('modal').style.display!=='flex')render()}
}
setTimeout(()=>sinkronRepo(true),1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sinkronRepo(false)});

/* ================= FORM MODAL ================= */
function form(judul,fields,onSave,info){
  const h=fields.map(f=>{if(f.hide)return '';const id='f_'+f.k,v=f.v??'';
    if(f.t==='sel')return `<label>${f.l}</label><select id="${id}">${f.o.map(o=>{const [val,txt]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(txt)}</option>`}).join('')}</select>`;
    const type=f.t==='date'?'date':f.t==='tel'?'tel':f.t==='pass'||f.t==='pin'?'password':'text',im=f.t==='rp'||f.t==='num'||f.t==='pin'?'inputmode="numeric"':'';
    const val=f.t==='rp'&&v?Number(v).toLocaleString('id-ID'):v;
    return `<label>${f.l}</label><input id="${id}" type="${type}" ${im} value="${esc(val)}" ${f.t==='rp'?'oninput="fmtRp(this)"':''}>`}).join('');
  document.getElementById('mbox').innerHTML=`<h3>${esc(judul)}</h3>${info?`<p class="mut">${esc(info)}</p>`:''}${h}
   <div class="row" style="margin-top:14px"><button class="sec grow" onclick="closeM()">Batal</button><button class="grow" id="fOk">Simpan</button></div>`;
  document.getElementById('modal').style.display='flex';
  document.getElementById('fOk').onclick=()=>{const d={};fields.forEach(f=>{if(f.hide){d[f.k]=f.v;return}const v=document.getElementById('f_'+f.k).value;d[f.k]=f.t==='rp'?num(v):v});
    const r=onSave(d);if(r===false)return toast('Lengkapi isian');if(typeof r==='string')return toast(r);save();closeM();render()};
}
function fmtRp(el){const n=el.value.replace(/\D/g,'');el.value=n?Number(n).toLocaleString('id-ID'):''}
function closeM(){document.getElementById('modal').style.display='none'}
function confirmDel(){return confirm('Hapus data ini?')}
function hapus(col,id){if(!confirmDel())return;S[col]=S[col].filter(x=>x.id!==id);save();render()}
