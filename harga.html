<title>Harga Emas Hari Ini</title>
<style>
:root{--bg:#14120d;--card:#1f1c15;--line:#3a3428;--gold:#d8b04c;--gold2:#f3d98b;--tx:#f2ede2;--mut:#a39a86;--ok:#5fbf7a;--bad:#e46b5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{padding:calc(18px + env(safe-area-inset-top)) 16px 14px;text-align:center;border-bottom:1px solid var(--line)}
header h1{margin:0;color:var(--gold2);font-size:22px}
header p{margin:4px 0 0;color:var(--mut);font-size:13px}
main{max-width:640px;margin:auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--gold2);display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{background:#16140f;border-radius:10px;padding:10px}
.grid span{display:block;color:var(--mut);font-size:12px}
.grid b{font-size:18px}
.big{font-size:30px;font-weight:700;text-align:center;margin:6px 0 2px}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
select,input{width:100%;background:#0f0d09;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:16px}
.wa{display:block;text-align:center;background:#25d366;color:#08240f;text-decoration:none;font-weight:700;border-radius:12px;padding:13px;margin:4px 0 12px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:0 20px 30px}
</style>
</head>

<main id="app"><p class="mut" style="text-align:center">Memuat harga…</p></main>
<footer>Harga Antam adalah harga referensi dari sumber resmi dan dapat berubah sewaktu-waktu. Harga global dari gold-api.com, kurs USD/IDR dari exchangerate.fun & open.er-api.com. Proyeksi hanya perkiraan, bukan saran investasi.</footer>
<script>
const OZ=31.1034768,AG=[0.5,1,2,3,5,10,25,50,100,250,500,1000];
let D=null,G={xau:0,kurs:0,at:'',cek:0},calcG=1;
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const fUsd=n=>Number(n||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=x=>(x*100).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const rnd=n=>Math.round(n/1000)*1000;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gL=g=>g>=1000?(g/1000)+' kg':String(g).replace('.',',')+' gr';
const kF=n=>{const a=Math.abs(n),s=n<0?'-':n>0?'+':'';return a>=1e6?s+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:2})+'jt':a>=1e3?s+(a/1e3).toLocaleString('id-ID',{maximumFractionDigits:1})+'rb':s+a};
const hari=t=>new Date(t+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const A=()=>D.antam,antamG=g=>A().beli*g+(Number(A().offset?.[String(g)])||0);
const spot=()=>G.xau&&G.kurs?G.xau*G.kurs/OZ:0;
const adj=()=>A().spotRef&&spot()?spot()-A().spotRef:0;
const beta=()=>A().beta||{b:1,bb:1};const pB=()=>rnd(A().beli+beta().b*adj()),pBb=()=>rnd(A().bb+beta().bb*adj());
const ch=(now,prev)=>{if(!prev)return '';const d=now-prev;return `<span class="${d>0?'ok':d<0?'bad':'mut'}">${d>0?'▲':d<0?'▼':'='} ${rp(Math.abs(d))} · ${pct(Math.abs(d)/prev)}</span>`};

const REPO=(()=>{const h=location.hostname.split('.'),p=location.pathname.split('/').filter(Boolean);return h[1]==='github'&&h[2]==='io'&&p.length>1?{o:h[0],r:p[0]}:null})();
async function ambil(path){const L=[fetch(path+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null)];
  if(REPO)L.push(fetch(`https://raw.githubusercontent.com/${REPO.o}/${REPO.r}/HEAD/${path}?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.json():null));
  const res=(await Promise.allSettled(L)).map(x=>x.status==='fulfilled'?x.value:null).filter(Boolean);
  return res.sort((a,b)=>new Date(b.diterbitkan||b.diperbarui||0)-new Date(a.diterbitkan||a.diperbarui||0))[0]||null}
let AKU=null;
async function loadData(){const [d,ak]=await Promise.all([ambil('harga.json'),ambil('akurasi.json')]);if(d)D=d;if(ak)AKU=ak;render()}
async function loadGlobal(){
  const now=Date.now(),kj=[];
  if(!G.kurs||now-(G.kt||0)>15*60e3){
    kj.push(fetch('https://api.exchangerate.fun/latest?base=USD').then(r=>r.json()).then(j=>j&&j.rates&&j.rates.IDR?{k:+j.rates.IDR,at:(j.timestamp||0)*1000}:null));
    kj.push(fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json()).then(j=>j&&j.rates&&j.rates.IDR?{k:+j.rates.IDR,at:(j.time_last_update_unix||0)*1000}:null))}
  const [x,...ks]=await Promise.allSettled([fetch('https://api.gold-api.com/price/XAU',{cache:'no-store'}).then(r=>r.json()),...kj]);
  if(x.status==='fulfilled'&&x.value?.price){G.xau=+x.value.price;G.at=x.value.updatedAt||''}
  const best=ks.map(r=>r.status==='fulfilled'?r.value:null).filter(Boolean).sort((a,b)=>b.at-a.at)[0];
  if(best){G.kurs=best.k;G.kAt=best.at;G.kt=now}
  if(!G.kurs&&D?.antam?.spotRef&&D.antam.xauRef)G.kurs=D.antam.spotRef*OZ/D.antam.xauRef;
  G.cek=Date.now();render();
}
function render(){
  if(!D||!D.antam?.beli){document.getElementById('app').innerHTML='<div class="card"><p class="mut">Harga belum diterbitkan.</p></div>'+gCard();document.getElementById('sub').textContent='';return}
  const a=A(),t=D.toko||{},j=adj(),d=a.beli-a.prevBeli;
  document.getElementById('nama').textContent=t.nama||'Harga Emas Hari Ini';
  document.getElementById('sub').textContent='Harga emas hari ini · '+hari(a.tgl);
  document.title='Harga Emas Hari Ini – '+(t.nama||'');
  document.getElementById('app').innerHTML=`
  ${gCard()}
  <div class="card"><h2>🏛️ Harga Antam resmi</h2>
    <div class="grid"><div><span>Harga beli / gr</span><b>${rp(a.beli)}</b><br>${ch(a.beli,a.prevBeli)}</div>
    <div><span>Buyback / gr</span><b>${rp(a.bb)}</b><br>${ch(a.bb,a.prevBb)}</div></div>
    <p class="mut">Selisih beli–buyback ${rp(a.beli-a.bb)} (${pct((a.beli-a.bb)/a.beli)}) · update ${hari(a.tgl)}, ${esc(a.jam)} WIB</p>
    ${a.spotRef&&G.xau?`<div class="grid"><div><span>🔮 Proyeksi beli</span><b>${rp(pB())}</b></div><div><span>🔮 Proyeksi buyback</span><b>${rp(pBb())}</b></div></div>
    <p class="mut">Perkiraan dari pergerakan XAUUSD & kurs sejak ${esc(a.jam)} WIB (est. ${j<0?'-':'+'}${rp(Math.abs(j))}/gr). Harga resmi bisa berbeda.</p>`:''}
  </div>
  ${t.tampil&&t.jual?`<div class="card"><h2>🏪 Harga ${esc(t.nama)}</h2><div class="grid"><div><span>Kami jual / gr</span><b>${rp(t.jual)}</b></div><div><span>Kami beli (buyback) / gr</span><b>${rp(t.buyback)}</b></div></div>
   ${t.tabel?`<table style="margin-top:8px"><tr><th>Berat</th><th>Kami jual</th><th>Kami beli</th></tr>${Object.keys(t.tabel).sort((a,b)=>a-b).map(g=>`<tr><td>${gL(+g)}</td><td>${rp(t.tabel[g].j)}</td><td>${rp(t.tabel[g].b)}</td></tr>`).join('')}</table>`:''}</div>`:''}
  ${t.links?.wa?`<a class="wa" style="background:#d8b04c;color:#3a0707" href="${esc(t.links.wa)}">🔔 Ikuti Channel WhatsApp</a>`:''}
  ${t.links?.tg?`<a class="wa" style="background:#2aabee;color:#fff" href="${esc(t.links.tg)}">📢 Gabung Channel Telegram</a>`:''}
  ${t.wa?`<a class="wa" href="https://wa.me/${esc(t.wa)}?text=${encodeURIComponent('Halo '+(t.nama||'')+', saya mau tanya harga emas hari ini.')}">💬 Pesan / tanya via WhatsApp</a>`:''}
  <div class="card"><h2>📋 Daftar harga emas batangan Antam</h2>
    <table><tr><th>Berat</th><th>Harga</th><th>Perubahan</th></tr>${AG.map(g=>`<tr><td>${gL(g)}</td><td>${rp(antamG(g))}</td><td class="${d<0?'bad':d>0?'ok':'mut'}">${a.prevBeli?kF(d*g):''}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>🧮 Kalkulator</h2>
    <select onchange="calcG=+this.value;render()">${AG.map(g=>`<option value="${g}" ${g===calcG?'selected':''}>${gL(g)}</option>`).join('')}</select>
    <table style="margin-top:8px"><tr><td>Harga beli Antam</td><td><b>${rp(antamG(calcG))}</b></td></tr><tr><td>Buyback Antam</td><td>${rp(a.bb*calcG)}</td></tr>
    ${t.tampil&&t.jual?(t.tabel&&t.tabel[String(calcG)]?`<tr><td>Harga jual kami</td><td><b>${rp(t.tabel[String(calcG)].j)}</b></td></tr><tr><td>Kami beli dari Anda</td><td>${rp(t.tabel[String(calcG)].b)}</td></tr>`:`<tr><td>Kami beli dari Anda</td><td>${rp(t.buyback*calcG)}</td></tr>`):''}</table></div>
  ${akurasi()}
  ${grafik()}`;
}
function akurasi(){const r=AKU&&AKU.ringkasan;if(!r||!r.n)return '';const L=(AKU.riwayat||[]).slice(-5).reverse();
  return `<div class="card"><h2>🎯 Akurasi prediksi</h2><div class="grid"><div><span>Arah tepat</span><b>${r.tepat}/${r.n} hari</b></div><div><span>Selisih rata-rata</span><b>${rp(r.rataErr)}</b></div></div>
  <table style="margin-top:8px"><tr><th>Tanggal</th><th>Prediksi</th><th>Resmi</th><th></th></tr>${L.map(x=>`<tr><td>${x.tgl.slice(8,10)}/${x.tgl.slice(5,7)}</td><td>${rp(x.pred)}</td><td>${rp(x.actual)}</td><td>${x.tepat?'✅':'❌'}</td></tr>`).join('')}</table>
  <p class="mut">Kami menampilkan catatan ini apa adanya, tepat maupun meleset. Prediksi tetap perkiraan, bukan saran investasi.</p></div>`}
function gCard(){const a=D?.antam,j=a?adj():0,xc=a?.xauRef&&G.xau?(G.xau-a.xauRef)/a.xauRef:null;
  return `<div class="card"><h2><span class="live"></span> Harga emas global</h2>
  ${G.xau?`<div class="grid"><div><span>XAUUSD</span><b>$${fUsd(G.xau)}</b>${xc!==null?`<br><span class="${xc<0?'bad':'ok'}">${xc<0?'▼':'▲'} ${pct(Math.abs(xc))}</span>`:''}</div>
  <div><span>Spot IDR / gram</span><b>${rp(spot())}</b><br><span class="mut">kurs ${rp(G.kurs)}${G.kAt?' · '+new Date(G.kAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):''}</span></div></div>
  ${a?.spotRef?`<div class="big ${j<0?'bad':'ok'}">${j<0?'▼':'▲'} IDR ${j<0?'-':'+'}${Math.round(Math.abs(j)).toLocaleString('id-ID')}</div><p class="mut" style="text-align:center;margin:0">per gram sejak update Antam ${esc(a.jam)} WIB</p>`:''}
  <p class="mut">Harga pasar per ${G.at?new Date(G.at).toLocaleString('id-ID',{weekday:'long',hour:'2-digit',minute:'2-digit'}):'-'} · diperbarui otomatis tiap menit. Akhir pekan pasar global tutup.</p>`
  :'<p class="mut">Memuat harga global…</p>'}</div>`}
function grafik(){const r=(A().riwayat||[]).slice(-60);if(r.length<2)return '';
  const W=320,H=120,v=r.map(x=>x.beli),mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-10-(y-mn)/rg*(H-20)).toFixed(1)}`).join(' ');
  return `<div class="card"><h2>📈 Riwayat harga Antam</h2><svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${pts}" fill="none" stroke="#d8b04c" stroke-width="2.2"/></svg>
  <p class="mut" style="display:flex;justify-content:space-between;margin:0"><span>${r[0].tgl}: ${rp(r[0].beli)}</span><span>${r.at(-1).tgl}: ${rp(r.at(-1).beli)}</span></p></div>`}
loadData().then(loadGlobal);
setInterval(()=>{if(!document.hidden)loadGlobal()},60000);
setInterval(()=>{if(!document.hidden)loadData()},300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadData();loadGlobal()}});
</script>
